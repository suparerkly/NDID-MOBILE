plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// คีย์สำหรับเซ็น release อยู่นอก git ดูวิธีตั้งค่าใน android/key.properties.example
def keyProperties = new Properties()
def keyPropertiesFile = rootProject.file("key.properties")
if (keyPropertiesFile.exists()) {
    keyPropertiesFile.withInputStream { keyProperties.load(it) }
}

android {
    namespace = "com.suparerk.identitydemo"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    defaultConfig {
        // เปลี่ยนไม่ได้หลังอัปโหลดขึ้น Google Play ครั้งแรก
        applicationId = "com.suparerk.identitydemo"
        minSdk = 21
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (keyPropertiesFile.exists()) {
            release {
                storeFile = rootProject.file(keyProperties["storeFile"])
                storePassword = keyProperties["storePassword"]
                keyAlias = keyProperties["keyAlias"]
                keyPassword = keyProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            if (keyPropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            } else {
                // ใช้เดโมบนเครื่องได้ แต่ Google Play จะไม่รับไฟล์ที่เซ็นด้วย debug key
                logger.warn("android/key.properties not found: signing release with the debug key")
                signingConfig = signingConfigs.debug
            }
        }
    }
}

flutter {
    source = "../.."
}
